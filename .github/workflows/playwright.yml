name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"                                  # makes config run headless
      APP_URL: ${{ vars.APP_URL }}                # falls back to the default in playwright.config.ts if empty
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      API_KEY: ${{ secrets.API_KEY }}
      # Add any other variables your .env provides (login user/password etc.) as repo secrets:
      # TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      # TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5     # allure-commandline needs Java
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run Prospect script
        run: npx playwright test tests/e2e/Prospect.spec.ts --project=chrome

      - name: Run ConvertToRecruit script
        if: success() || failure()          # runs even if the Prospect step failed
        run: npx playwright test tests/e2e/ConvertToRecruit.spec.ts --project=chrome

      - name: Generate Allure report
        if: always()
        run: npx --no-install allure generate allure-results --clean -o allure-report

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            playwright-report/
            allure-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
